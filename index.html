<body>
<canvas id="sky"></canvas>
<main>

  </div>

<script>
(function(){
  const canvas = document.getElementById('sky');
  if (!canvas) return;
  const ctx = canvas.getContext('2d', { alpha: true });
  const params = new URLSearchParams(location.search);
  const demo = params.get('demo') === '1';
  const atRaw = params.get('at');
  const freezeAt = atRaw != null && atRaw !== '' && !Number.isNaN(Number(atRaw)) ? Number(atRaw) : null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const GOLD = 0.07, GC = '232,196,110';
  const DEMO_GAP = 2000, DEMO_DUR = 1000;

  // Seeded RNG so ?demo=1&at= frames (and the recording) share the same sky.
  function mulberry32(a){
    return function(){
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  const rng = demo ? mulberry32(0x5EED) : Math.random;
  const rand = (a, b) => a + rng() * (b - a);

  let W = 0, H = 0, dpr = 1, stars = [], showers = [];
  let raf = 0, t0 = 0, pausedAt = 0, pauseAccum = 0, nextShowerAt = 0;

  function simTime(){
    if (freezeAt != null) return freezeAt;
    return performance.now() - t0 - pauseAccum;
  }

  function resize(){
    dpr = Math.min(devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
  }

  function buildStars(){
    stars = [];
    const n = Math.floor(W * H / 1400);
    for (let i = 0; i < n; i++){
      const roll = rng();
      const bright = roll > 0.9;
      stars.push({
        x: rng() * W,
        y: rng() * H,
        r: bright ? rand(1.15, 2.2) : rand(0.25, 1.15),
        base: bright ? rand(0.62, 0.82) : rand(0.38, 0.7),
        amp: bright ? rand(0.1, 0.2) : rand(0.1, 0.26),
        period: rand(3.2, 8.5),
        phase: rng() * Math.PI * 2,
        gold: rng() < GOLD,
        glint: bright && rng() < 0.75,
        glintPeriod: rand(10, 22),
        glintPhase: rng() * Math.PI * 2
      });
    }
  }

  function makeShower(start, opts){
    const forced = opts && opts.forced;
    const fromLeft = forced ? true : rng() < 0.7;
    const angle = forced ? 0.48 : (fromLeft ? rand(0.32, 0.7) : rand(Math.PI - 0.7, Math.PI - 0.32));
    const len = (forced ? 0.44 : rand(0.28, 0.55)) * Math.hypot(W, H);
    const x0 = forced ? W * 0.08 : (fromLeft ? rand(-0.05, 0.65) * W : rand(0.35, 1.05) * W);
    const y0 = forced ? H * 0.08 : rand(-0.04, 0.42) * H;
    const dur = (opts && opts.dur) || (forced ? DEMO_DUR : rand(800, 1200));
    return { x0, y0, dx: Math.cos(angle) * len, dy: Math.sin(angle) * len, start, dur };
  }

  function syncShowers(t){
    showers = showers.filter(s => t - s.start < s.dur && t >= s.start);
    if (reduced) { showers = []; return; }
    if (demo && freezeAt != null){
      showers = [];
      for (let s = 0; s <= t; s += DEMO_GAP){
        if (t - s < DEMO_DUR) showers.push(makeShower(s, { forced: s === 0, dur: DEMO_DUR }));
      }
      return;
    }
    if (t >= nextShowerAt && showers.length < 2){
      showers.push(makeShower(t, demo && showers.length === 0 && t < 50 ? { forced: true, dur: DEMO_DUR } : null));
      nextShowerAt = t + (demo ? rand(1600, 2200) : rand(4000, 10000));
    }
  }

  function starAlpha(s, tSec){
    if (reduced) return { a: s.base, glintK: 0 };
    const wave = Math.sin((tSec / s.period) * Math.PI * 2 + s.phase);
    let a = s.base + s.amp * wave;
    let glintK = 0;
    if (s.glint && !reduced){
      const g = Math.sin((tSec / s.glintPeriod) * Math.PI * 2 + s.glintPhase);
      if (g > 0.984){
        glintK = (g - 0.984) / 0.016;
        a += glintK * glintK * 0.4;
      }
    }
    return { a: Math.min(1, Math.max(0.16, a)), glintK };
  }

  function drawStars(t){
    const tSec = t / 1000;
    for (let i = 0; i < stars.length; i++){
      const s = stars[i];
      const { a, glintK } = starAlpha(s, tSec);
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = s.gold ? 'rgba(' + GC + ',' + a + ')' : 'rgba(255,255,255,' + a + ')';
      ctx.fill();
      if (s.r > 1.55){
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 3.2, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.1) + ')';
        ctx.fill();
      }
      if (glintK > 0){
        const len = s.r * (2.8 + 2.2 * glintK);
        ctx.strokeStyle = 'rgba(255,255,255,' + (0.35 * glintK) + ')';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x + len, s.y);
        ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y + len);
        ctx.stroke();
      }
    }
  }

  function drawShower(s, t){
    const p = (t - s.start) / s.dur;
    if (p < 0 || p > 1) return;
    const fade = p < 0.1 ? p / 0.1 : (p > 0.78 ? (1 - p) / 0.22 : 1);
    const x = s.x0 + s.dx * p;
    const y = s.y0 + s.dy * p;
    const path = Math.hypot(s.dx, s.dy);
    const ux = s.dx / path, uy = s.dy / path;
    const tail = Math.min(path * 0.38, Math.max(W, H) * 0.28) * Math.min(1, p / 0.18 + 0.15);
    const x2 = x - ux * tail, y2 = y - uy * tail;
    const g = ctx.createLinearGradient(x2, y2, x, y);
    g.addColorStop(0, 'rgba(255,255,255,0)');
    g.addColorStop(0.55, 'rgba(255,252,245,' + (0.22 * fade) + ')');
    g.addColorStop(1, 'rgba(255,255,255,' + (0.88 * fade) + ')');
    ctx.strokeStyle = g;
    ctx.lineWidth = 1.15;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x, y);
    ctx.stroke();
    const rg = ctx.createRadialGradient(x, y, 0, x, y, 9);
    rg.addColorStop(0, 'rgba(255,255,255,' + (0.95 * fade) + ')');
    rg.addColorStop(0.28, 'rgba(255,248,230,' + (0.4 * fade) + ')');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = rg;
    ctx.beginPath();
    ctx.arc(x, y, 9, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw(t){
    ctx.clearRect(0, 0, W, H);
    drawStars(t);
    if (!reduced){
      syncShowers(t);
      for (let i = 0; i < showers.length; i++) drawShower(showers[i], t);
    }
  }

  function loop(){
    if (document.hidden) return;
    draw(simTime());
    raf = requestAnimationFrame(loop);
  }

  function stop(){
    if (raf){ cancelAnimationFrame(raf); raf = 0; }
  }

  document.addEventListener('visibilitychange', function(){
    if (freezeAt != null || reduced) return;
    if (document.hidden){
      pausedAt = performance.now();
      stop();
    } else {
      if (pausedAt) pauseAccum += performance.now() - pausedAt;
      pausedAt = 0;
      if (!raf) raf = requestAnimationFrame(loop);
    }
  });

  addEventListener('resize', function(){
    resize();
    if (freezeAt != null || reduced) draw(simTime());
  });

  resize();
  t0 = performance.now();
  if (demo){
    nextShowerAt = 0;
    if (freezeAt == null) showers.push(makeShower(0, { forced: true, dur: DEMO_DUR }));
    nextShowerAt = DEMO_GAP;
  } else {
    nextShowerAt = rand(4000, 10000);
  }

  if (reduced){
    draw(0);
    return;
  }
  if (freezeAt != null){
    draw(freezeAt);
    return;
  }
  draw(0);
  raf = requestAnimationFrame(loop);
})();
(function(){
  function fallbackCopy(text){
    return new Promise(function(resolve, reject){
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.setAttribute('aria-hidden', 'true');
      ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      let ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      ok ? resolve() : reject(new Error('copy failed'));
    });
  }
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(function(){ return fallbackCopy(text); });
    }
    return fallbackCopy(text);
  }
  document.querySelectorAll('[data-copy]').forEach(function(el){
    const label = el.querySelector('.cl');
    let timer = 0;
    function showCopied(on){
      el.classList.toggle('is-copied', on);
      if (!label) return;
      const next = on ? 'copied' : 'copy';
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce){ label.textContent = next; return; }
      label.style.opacity = '0';
      requestAnimationFrame(function(){
        label.textContent = next;
        requestAnimationFrame(function(){ label.style.opacity = '1'; });
      });
    }
    el.addEventListener('click', function(){
      const text = el.getAttribute('data-copy');
      copyText(text).finally(function(){
        showCopied(true);
        clearTimeout(timer);
        timer = setTimeout(function(){ showCopied(false); }, 1800);
      });
    });
  });
})();
</script>
</body>
