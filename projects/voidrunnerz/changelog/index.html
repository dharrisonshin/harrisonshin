<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap index">
  <a class="home" href="../../../">harrison shin</a>

  <div class="rule" aria-hidden="true"></div>
  <h1>voidrunnerz changelog</h1>
  <p class="lede">every build, newest first.</p>
  <div class="prose changelog" id="changelog" hidden></div>
  <p class="note" id="changelog-empty" hidden>the changelog could not be loaded.</p>
  <footer class="post-foot">
    <a href="../../">projects</a>
    <a href="../../../">home</a>
  </footer>
</div>
<script src="../../../read-sky.js"></script>
<script>
(function(){
  var root = document.getElementById('changelog');
  var empty = document.getElementById('changelog-empty');
  if (!root || !empty) return;

  var DATE_LINE = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s+\d{1,2},\s+\d{4}$/;

  function esc(value){
    return value
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }

  function render(markdown){
    var lines = markdown.replace(/\r\n/g, '\n').split('\n');
    var html = '';
    var list = false;
    var started = false;
    function closeList(){
      if (!list) return;
      html += '</ul>';
      list = false;
    }
    lines.forEach(function(line){
      if (!started){
        if (line.indexOf('## ') === 0) started = true;
        else return;
      }
      if (!line.trim()){
        closeList();
        return;
      }
      if (line.indexOf('## ') === 0){
        closeList();
        html += '<h2>' + esc(line.slice(3).trim()) + '</h2>';
        return;
      }
      if (line.indexOf('- ') === 0){
        if (!list){
          html += '<ul>';
          list = true;
        }
        html += '<li>' + esc(line.slice(2).trim()) + '</li>';
        return;
      }
      closeList();
      var text = line.trim();
      if (DATE_LINE.test(text)) html += '<p class="changelog-date">' + esc(text) + '</p>';
      else html += '<p>' + esc(text) + '</p>';
    });
    closeList();
    return html;
  }

  fetch('CHANGELOG.md?t=' + Date.now(), { cache: 'no-store' })
    .then(function(res){
      if (!res.ok) throw new Error('changelog unavailable');
      return res.text();
    })
    .then(function(markdown){
      var html = render(markdown);
      if (!html) throw new Error('changelog empty');
      root.innerHTML = html;
      root.hidden = false;
    })
    .catch(function(){
      empty.hidden = false;
    });
})();
</script>
