<body class="reader-page">
<canvas id="sky" aria-hidden="true"></canvas>
<article class="wrap post reader">
  <a class="home" href="../">harrison shin</a>
  <div class="rule" aria-hidden="true"></div>
  <header class="reader-head">
    <h1>reader</h1>
    <p class="reader-lead">A curated feed of newsletters, blogs, and channels. Refreshed daily. Read state stays on this device.</p>
    <p class="reader-meta" id="reader-meta" hidden></p>
  </header>

  <div class="reader-toolbar" role="toolbar" aria-label="Reader filters">
    <div class="reader-views" role="group" aria-label="View">
      <button type="button" class="reader-chip is-active" data-view="digest" aria-pressed="true">digest</button>
      <button type="button" class="reader-chip" data-view="unread" aria-pressed="false">unread</button>
      <button type="button" class="reader-chip" data-view="all" aria-pressed="false">all</button>
    </div>
    <div class="reader-kinds" role="group" aria-label="Kind" id="reader-kinds"></div>
  </div>

  <div class="reader-actions">
    <button type="button" class="reader-text-btn" id="mark-visible-read">mark visible read</button>
    <button type="button" class="reader-text-btn" id="mark-all-unread">reset read state</button>
  </div>

  <div id="reader-root">
    <noscript><p class="note">The reader needs JavaScript to load the digest.</p></noscript>
    <p class="note" id="reader-loading">Loading feeds…</p>
  </div>
</article>
<script src="reader.js"></script>
<script src="../read-sky.js"></script>
</body>
