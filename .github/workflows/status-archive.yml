# When status.json changes on main, archive the previous caption into
# status-history.json so /status/ stays current without a second manual edit.
name: Archive previous status

on:
  push:
    branches: [main]
    paths: [status.json]

permissions:
  contents: write

concurrency:
  group: status-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Archive previous status
        run: python3 scripts/archive-status.py

      - name: Commit history if needed
        run: |
          if git diff --quiet -- status-history.json; then
            echo "no history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status-history.json
          git commit -m "Archive previous homepage status."
          git push
