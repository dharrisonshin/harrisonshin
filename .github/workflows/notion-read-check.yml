# Temporary read-only check. Prints row counts only. Does not write library files or push.
name: Read Notion counts

on:
  workflow_dispatch:
  push:
    branches: [cursor/library-substack-projects-5bc5]
    paths: ['.github/workflows/notion-read-check.yml']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Count database rows
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          python3 - << 'PY'
          import json, os, sys, urllib.error, urllib.request

          BOOKS = "4d5d72e04b7344f8906d5fbd1d18f5bd"
          MOVIES = "fb0aa94ce43d46bda4a4cfe87c98b02b"
          VERSION = "2022-06-28"

          token = (os.environ.get("NOTION_TOKEN") or "").strip()
          if not token:
              print("NOTION_TOKEN is not set.")
              sys.exit(1)

          def query(database_id):
              pages = []
              cursor = None
              while True:
                  body = {"page_size": 100}
                  if cursor:
                      body["start_cursor"] = cursor
                  request = urllib.request.Request(
                      "https://api.notion.com/v1/databases/%s/query" % database_id,
                      data=json.dumps(body).encode("utf-8"),
                      headers={
                          "Authorization": "Bearer " + token,
                          "Notion-Version": VERSION,
                          "Content-Type": "application/json",
                      },
                      method="POST",
                  )
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          payload = json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as error:
                      raw = error.read().decode("utf-8", "replace")[:400]
                      code = ""
                      message = ""
                      try:
                          parsed = json.loads(raw)
                          code = parsed.get("code") or ""
                          message = parsed.get("message") or ""
                      except json.JSONDecodeError:
                          message = "unparsed error"
                      return {"ok": False, "http": error.code, "code": code, "message": message}
                  pages.extend(payload.get("results") or [])
                  if not payload.get("has_more"):
                      break
                  cursor = payload.get("next_cursor")
                  if not cursor:
                      break
              return {"ok": True, "pages": pages}

          def select_name(page, prop_name):
              prop = (page.get("properties") or {}).get(prop_name) or {}
              if prop.get("type") != "select" or not prop.get("select"):
                  return ""
              return (prop["select"].get("name") or "").strip()

          books = query(BOOKS)
          if not books["ok"]:
              print("reading list: no")
              print("reading list http: %s" % books["http"])
              print("reading list code: %s" % books["code"])
              print("reading list message: %s" % books["message"])
          else:
              pages = books["pages"]
              done = sum(1 for page in pages if select_name(page, "Status").casefold() == "done")
              print("reading list: yes")
              print("reading list rows: %s" % len(pages))
              print("reading list done: %s" % done)

          movies = query(MOVIES)
          if not movies["ok"]:
              print("movies: no")
              print("movies http: %s" % movies["http"])
              print("movies code: %s" % movies["code"])
              print("movies message: %s" % movies["message"])
          else:
              pages = movies["pages"]
              types = {}
              tv = 0
              for page in pages:
                  name = select_name(page, "Type") or "(blank or missing Type)"
                  types[name] = types.get(name, 0) + 1
                  if name.casefold() == "tv":
                      tv += 1
              print("movies: yes")
              print("movies rows: %s" % len(pages))
              print("movies type tv: %s" % tv)
              print("movies types: %s" % json.dumps(types, sort_keys=True))
          PY
